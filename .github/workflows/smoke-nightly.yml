name: Smoke (manual / nightly)

# 离线 FakeRag / DemoRag 回归已由 ci.yml 覆盖，本 workflow 不再重复跑 pytest/smoke。
# Live 真连见 live-linkage.yml（默认 if: false，需 self-hosted）。
#
# 保留本文件：workflow_dispatch 入口 + 指向 CI / Live 的说明，避免文档死链。

on:
  workflow_dispatch:

jobs:
  point-to-ci:
    name: Offline covered by CI
    runs-on: ubuntu-latest
    steps:
      - name: Redirect
        run: |
          echo "Offline orchestration (pytest FakeRag + smoke_with_rag --offline) runs in ci.yml on push/PR."
          echo "Live HTTP linkage: see live-linkage.yml (disabled on GitHub-hosted by default)."
          echo "Local evidence: scripts/live_integration_manual.py + live_function_test.py → data/eval/live_*.json"
