[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
markers =
    integration: live Copilot/RAG smoke (requires :8002 / :8001); skipped in CI by default
    langgraph: LangGraph interrupt/resume path (same as POST /runs)
